name: YouTube to Telegram MP3

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube URL to convert"
        required: true
        type: string

  repository_dispatch:
    types: [youtube_audio]

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp and EJS
        run: |
          python3 -m pip install --upgrade "yt-dlp[default]"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Restore YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "YOUTUBE_COOKIES secret is missing."
            exit 1
          fi

          echo "$YOUTUBE_COOKIES_B64" | base64 --decode > youtube_cookies.txt
          chmod 600 youtube_cookies.txt

          if [ ! -s youtube_cookies.txt ]; then
            echo "Cookie file is empty."
            exit 1
          fi

      - name: Get YouTube information
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.url }}
        run: |
          if [ -z "$VIDEO_URL" ]; then
            echo "No YouTube URL was provided."
            exit 1
          fi

          yt-dlp \
            --cookies youtube_cookies.txt \
            --no-playlist \
            --print "%(title)s" \
            --print "%(uploader)s" \
            --print "%(thumbnail)s" \
            --skip-download \
            "$VIDEO_URL" > video_info.txt

          echo "YouTube information:"
          cat video_info.txt

          TITLE=$(sed -n '1p' video_info.txt)
          ARTIST=$(sed -n '2p' video_info.txt)
          THUMBNAIL=$(sed -n '3p' video_info.txt)

          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "ARTIST=$ARTIST" >> "$GITHUB_ENV"
          echo "THUMBNAIL=$THUMBNAIL" >> "$GITHUB_ENV"

      - name: Download YouTube audio
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.url }}
        run: |
          mkdir -p output

          yt-dlp \
            --cookies youtube_cookies.txt \
            --no-playlist \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 96K \
            --output "output/audio.%(ext)s" \
            "$VIDEO_URL"

      - name: Download artwork
        run: |
          if [ -z "$THUMBNAIL" ]; then
            echo "No thumbnail URL found."
            exit 1
          fi

          echo "Downloading artwork..."

          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "$THUMBNAIL" \
            -o output/cover.jpg

          if [ ! -s output/cover.jpg ]; then
            echo "Artwork download failed."
            exit 1
          fi

          echo "Artwork downloaded:"
          ls -lh output/cover.jpg

      - name: Add MP3 metadata and artwork
        run: |
          if [ ! -f "output/audio.mp3" ]; then
            echo "MP3 was not created."
            exit 1
          fi

          echo "Adding metadata..."

          ffmpeg \
            -y \
            -i "output/audio.mp3" \
            -i "output/cover.jpg" \
            -map 0:a \
            -map 1:v \
            -c:a copy \
            -c:v mjpeg \
            -id3v2_version 3 \
            -metadata title="$TITLE" \
            -metadata artist="$ARTIST" \
            -metadata album="$ARTIST" \
            -metadata album_artist="$ARTIST" \
            -metadata comment="YouTube" \
            -metadata:s:v title="Album cover" \
            -metadata:s:v comment="Cover (front)" \
            "output/final.mp3"

          mv output/final.mp3 output/audio.mp3

          echo "Metadata added successfully."

      - name: Check MP3
        run: |
          FILE="output/audio.mp3"

          if [ ! -f "$FILE" ]; then
            echo "MP3 was not created."
            echo "Files in output:"
            ls -lah output
            exit 1
          fi

          echo "MP3 found:"
          ls -lh "$FILE"

          echo "MP3 information:"
          file "$FILE"

          echo "Metadata:"
          ffprobe \
            -v quiet \
            -show_entries format_tags=title,artist,album,album_artist \
            -of default=noprint_wrappers=1 \
            "$FILE"

      - name: Check Telegram upload size
        run: |
          FILE="output/audio.mp3"

          SIZE_BYTES=$(stat -c%s "$FILE")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1024 / 1024}")

          echo "Final MP3 size: ${SIZE_MB} MB"

          MAX_BYTES=$((45 * 1024 * 1024))

          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "ERROR: MP3 is still too large for our safety limit."
            echo "Size: ${SIZE_MB} MB"
            echo "Please use a lower bitrate."
            exit 1
          fi

          echo "File size is safe for Telegram."

      - name: Send MP3 to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python3 <<'PY'
          import os
          import sys
          import uuid
          import urllib.request
          import urllib.error

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHANNEL_ID"]

          file_path = "output/audio.mp3"

          if not os.path.isfile(file_path):
              print(f"ERROR: File does not exist: {file_path}")
              sys.exit(1)

          file_size = os.path.getsize(file_path)

          print(f"Uploading: {file_path}")
          print(f"File size: {file_size / (1024 * 1024):.2f} MB")

          boundary = uuid.uuid4().hex
          boundary_bytes = boundary.encode()

          def add_field(name, value):
              return (
                  b"--" + boundary_bytes + b"\r\n"
                  + f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode()
                  + str(value).encode()
                  + b"\r\n"
              )

          body_start = b""

          body_start += add_field("chat_id", chat_id)

          body_start += add_field(
              "caption",
              "🎵 YouTube Audio"
          )

          filename = os.path.basename(file_path)

          body_start += (
              b"--" + boundary_bytes + b"\r\n"
              + f'Content-Disposition: form-data; name="audio"; filename="{filename}"\r\n'.encode()
              + b"Content-Type: audio/mpeg\r\n\r\n"
          )

          body_end = (
              b"\r\n--" + boundary_bytes + b"--\r\n"
          )

          url = f"https://api.telegram.org/bot{token}/sendAudio"

          print("Connecting to Telegram...")
          print("Uploading MP3...")

          with open(file_path, "rb") as f:
              file_data = f.read()

          body = body_start + file_data + body_end

          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": f"multipart/form-data; boundary={boundary}",
                  "Content-Length": str(len(body)),
                  "User-Agent": "GitHub-Actions-YouTube-Audio-Bot"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=600
              ) as response:

                  result = response.read().decode("utf-8")

                  print("Telegram response:")
                  print(result)

                  if '"ok":true' not in result:
                      print("ERROR: Telegram did not accept the upload.")
                      sys.exit(1)

                  print("SUCCESS: MP3 sent to Telegram!")

          except urllib.error.HTTPError as e:
              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("Telegram HTTP error:")
              print(f"Status: {e.code}")
              print(error_body)

              sys.exit(1)

          except Exception as e:
              print("Upload failed:")
              print(repr(e))

              sys.exit(1)
          PY

      - name: Delete cookies
        if: always()
        run: |
          rm -f youtube_cookies.txt
