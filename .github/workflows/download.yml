name: YouTube to Telegram MP3

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube URL to convert"
        required: true
        type: string

  repository_dispatch:
    types: [youtube_audio]

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp and EJS
        run: |
          python3 -m pip install --upgrade "yt-dlp[default]"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Restore YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "YOUTUBE_COOKIES secret is missing."
            exit 1
          fi

          echo "$YOUTUBE_COOKIES_B64" | base64 --decode > youtube_cookies.txt
          chmod 600 youtube_cookies.txt

          if [ ! -s youtube_cookies.txt ]; then
            echo "Cookie file is empty."
            exit 1
          fi

      - name: Get YouTube information
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.url }}
        run: |
          if [ -z "$VIDEO_URL" ]; then
            echo "No YouTube URL was provided."
            exit 1
          fi

          yt-dlp \
            --cookies youtube_cookies.txt \
            --no-playlist \
            --print "%(title)s" \
            --print "%(uploader)s" \
            --print "%(thumbnail)s" \
            --skip-download \
            "$VIDEO_URL" > video_info.txt

          echo "YouTube information:"
          cat video_info.txt

          TITLE=$(sed -n '1p' video_info.txt)
          ARTIST=$(sed -n '2p' video_info.txt)
          THUMBNAIL=$(sed -n '3p' video_info.txt)

          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "ARTIST=$ARTIST" >> "$GITHUB_ENV"
          echo "THUMBNAIL=$THUMBNAIL" >> "$GITHUB_ENV"

      - name: Download YouTube audio
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.url }}
        run: |
          mkdir -p output

          yt-dlp \
            --cookies youtube_cookies.txt \
            --no-playlist \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 96K \
            --output "output/audio.%(ext)s" \
            "$VIDEO_URL"

      - name: Download YouTube artwork
        run: |
          echo "Downloading YouTube artwork..."

          curl \
            -L \
            --fail \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "$THUMBNAIL" \
            -o output/original_cover.jpg

          if [ ! -s output/original_cover.jpg ]; then
            echo "Artwork download failed."
            exit 1
          fi

          echo "Artwork downloaded:"
          ls -lh output/original_cover.jpg

      - name: Prepare album artwork
        run: |
          echo "Preparing artwork for ID3..."

          ffmpeg \
            -y \
            -i output/original_cover.jpg \
            -vf "scale=1000:1000:force_original_aspect_ratio=decrease,pad=1000:1000:(ow-iw)/2:(oh-ih)/2" \
            -q:v 2 \
            output/cover.jpg

          if [ ! -s output/cover.jpg ]; then
            echo "Failed to create cover."
            exit 1
          fi

          echo "Final artwork:"
          ls -lh output/cover.jpg

      - name: Embed ID3 metadata and artwork
        run: |
          echo "Creating final MP3..."

          ffmpeg \
            -y \
            -i output/audio.mp3 \
            -i output/cover.jpg \
            -map 0:a:0 \
            -map 1:v:0 \
            -c:a copy \
            -c:v mjpeg \
            -id3v2_version 3 \
            -write_id3v1 1 \
            -metadata "title=$TITLE" \
            -metadata "artist=$ARTIST" \
            -metadata "album=$ARTIST" \
            -metadata "album_artist=$ARTIST" \
            -metadata "comment=Downloaded from YouTube" \
            -metadata:s:v "title=Album cover" \
            -metadata:s:v "comment=Cover (front)" \
            output/final.mp3

          mv output/final.mp3 output/audio.mp3

          echo "Final MP3 created."

      - name: Verify MP3 metadata
        run: |
          echo "=============================="
          echo "VERIFYING FINAL MP3"
          echo "=============================="

          ffprobe \
            -hide_banner \
            -loglevel error \
            -show_entries format_tags=title,artist,album,album_artist,comment \
            -show_entries stream=index,codec_name,codec_type:stream_tags=title,comment \
            -of default=noprint_wrappers=1 \
            output/audio.mp3

          echo "=============================="
          echo "Checking for embedded artwork"
          echo "=============================="

          COVER_CHECK=$(ffprobe \
            -v error \
            -select_streams v \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            output/audio.mp3)

          if [ -z "$COVER_CHECK" ]; then
            echo "ERROR: No embedded artwork was found."
            exit 1
          fi

          echo "Embedded artwork detected: $COVER_CHECK"

      - name: Check MP3
        run: |
          FILE="output/audio.mp3"

          if [ ! -f "$FILE" ]; then
            echo "MP3 was not created."
            exit 1
          fi

          echo "Final MP3:"
          ls -lh "$FILE"

          SIZE_BYTES=$(stat -c%s "$FILE")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1024 / 1024}")

          echo "Final MP3 size: ${SIZE_MB} MB"

      - name: Check Telegram upload size
        run: |
          FILE="output/audio.mp3"

          SIZE_BYTES=$(stat -c%s "$FILE")
          MAX_BYTES=$((45 * 1024 * 1024))

          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "ERROR: MP3 is too large."
            echo "Size: $SIZE_BYTES bytes"
            exit 1
          fi

          echo "File size is safe for Telegram."

      - name: Send MP3 to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python3 <<'PY'
          import os
          import sys
          import uuid
          import urllib.request
          import urllib.error
          import re

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHANNEL_ID"]

          file_path = "output/audio.mp3"

          if not os.path.isfile(file_path):
              print("ERROR: MP3 does not exist.")
              sys.exit(1)

          title = os.environ.get("TITLE", "YouTube Audio")
          artist = os.environ.get("ARTIST", "YouTube")

          # Create a safe filename for Telegram
          safe_title = re.sub(r'[\\/:*?"<>|]', '', title)
          safe_title = safe_title.strip()

          if not safe_title:
              safe_title = "YouTube Audio"

          filename = f"{safe_title}.mp3"

          # Keep filename reasonably sized
          if len(filename) > 180:
              filename = filename[:176] + ".mp3"

          boundary = uuid.uuid4().hex
          boundary_bytes = boundary.encode()

          def add_field(name, value):
              return (
                  b"--" + boundary_bytes + b"\r\n"
                  + f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode()
                  + str(value).encode()
                  + b"\r\n"
              )

          body = b""

          # Destination
          body += add_field("chat_id", chat_id)

          # Telegram displayed title
          body += add_field("title", title)

          # Telegram displayed performer
          body += add_field("performer", artist)

          # Caption
          caption = (
              f"🎵 {title}\n"
              f"👤 {artist}"
          )

          body += add_field("caption", caption)

          # MP3
          body += (
              b"--" + boundary_bytes + b"\r\n"
              + f'Content-Disposition: form-data; name="audio"; filename="{filename}"\r\n'.encode()
              + b"Content-Type: audio/mpeg\r\n\r\n"
          )

          with open(file_path, "rb") as f:
              body += f.read()

          body += b"\r\n"

          body += (
              b"--" + boundary_bytes + b"--\r\n"
          )

          url = f"https://api.telegram.org/bot{token}/sendAudio"

          print("Uploading MP3 to Telegram...")
          print(f"Title: {title}")
          print(f"Artist: {artist}")
          print(f"Filename: {filename}")

          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": f"multipart/form-data; boundary={boundary}",
                  "Content-Length": str(len(body)),
                  "User-Agent": "GitHub-Actions-YouTube-Audio-Bot"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=600
              ) as response:

                  result = response.read().decode("utf-8")

                  print("Telegram response:")
                  print(result)

                  if '"ok":true' not in result:
                      print("ERROR: Telegram rejected the upload.")
                      sys.exit(1)

                  print("SUCCESS!")
                  print("Telegram received the titled MP3.")

          except urllib.error.HTTPError as e:
              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("Telegram HTTP error:")
              print(f"Status: {e.code}")
              print(error_body)

              sys.exit(1)

          except Exception as e:
              print("Upload failed:")
              print(repr(e))

              sys.exit(1)
          PY

      - name: Delete cookies
        if: always()
        run: |
          rm -f youtube_cookies.txt
