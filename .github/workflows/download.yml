name: YouTube to Telegram MP3

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube URL to convert"
        required: true
        type: string

  repository_dispatch:
    types: [youtube_audio]

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp and EJS
        run: |
          python3 -m pip install --upgrade "yt-dlp[default]"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Restore YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "YOUTUBE_COOKIES secret is missing."
            exit 1
          fi

          echo "$YOUTUBE_COOKIES_B64" | base64 --decode > youtube_cookies.txt
          chmod 600 youtube_cookies.txt

          if [ ! -s youtube_cookies.txt ]; then
            echo "Cookie file is empty."
            exit 1
          fi

      - name: Download YouTube audio
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.url }}
        run: |
          if [ -z "$VIDEO_URL" ]; then
            echo "No YouTube URL was provided."
            exit 1
          fi

          mkdir -p output

          yt-dlp \
            --cookies youtube_cookies.txt \
            --no-playlist \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 192K \
            --embed-thumbnail \
            --add-metadata \
            --output "output/audio.%(ext)s" \
            "$VIDEO_URL"

      - name: Check MP3
        id: findmp3
        run: |
          FILE="output/audio.mp3"

          if [ ! -f "$FILE" ]; then
            echo "MP3 was not created."
            echo "Files in output:"
            ls -lah output
            exit 1
          fi

          echo "MP3 found:"
          ls -lh "$FILE"

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Send MP3 to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          FILE="output/audio.mp3"

          if [ ! -f "$FILE" ]; then
            echo "MP3 file does not exist: $FILE"
            ls -lah output
            exit 1
          fi

          chmod 644 "$FILE"

          echo "MP3 details:"
          ls -lh "$FILE"
          file "$FILE"

          echo "Sending $FILE to Telegram..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendAudio" \
            -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -F "audio=@${FILE};type=audio/mpeg" \
            -F "caption=🎵 YouTube Audio")

          echo "Telegram response:"
          echo "$RESPONSE"

      - name: Delete cookies
        if: always()
        run: |
          rm -f youtube_cookies.txt
